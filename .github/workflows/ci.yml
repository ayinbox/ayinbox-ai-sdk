name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (ai ${{ matrix.ai }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ai 7 needs Node 22; ai 6 is the version that runs on Node 20.
          - node: 20
            ai: 6
          - node: 22
            ai: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.ai == 6
        run: npm install --no-save ai@6
      - if: matrix.ai == 7
        run: npm run typecheck
      - run: npm run build
      - run: npm test
